site_name: PixelNet Wiki
site_url: https://wiki.pixelnet.ca/
site_description: Guides, mods et réparation de consoles rétro — PixelNet, Trois-Rivières
copyright: © PixelNet · <a href="https://pixelnet.ca">pixelnet.ca</a> · <a href="https://ko-fi.com/pixelnetca">Support PixelNetCA ☕</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-horizontal.png
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: material/store
      link: https://pixelnet.ca
      name: Boutique PixelNet
    - icon: material/email
      link: mailto:support@pixelnet.ca
      name: support@pixelnet.ca
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@PixelNetCA
      name: YouTube @PixelNetCA
    - icon: simple/kofi
      link: https://ko-fi.com/pixelnetca
      name: Support PixelNetCA (Ko-fi)

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true
      skip_classes:
        - pn-noclick
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Guides: Guides
            Consoles: Consoles
            General: Général
            Which scaler?: Quel scaler ?
            Power supplies: Alimentations
            Glossary: Lexique
            Resources: Ressources
            Other consoles: Autres consoles

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - General:
          - Which scaler?: guides/scalers.md
          - Power supplies: guides/power-supplies.md
      - NES:
          - Lava RGB 2.0: guides/nes-lava-rgb.md
      - Super Nintendo:
          - CleanRGB + EdgeBuster: guides/snes-cleanrgb-edgebuster.md
      - PlayStation:
          - XStation (PU-18): guides/ps1-xstation-pu18.md
  - Consoles:
      - consoles/index.md
      - Nintendo:
          - consoles/nintendo/index.md
          - "NES / Famicom": consoles/nintendo/nes.md
          - "Super Nintendo / Super Famicom": consoles/nintendo/snes.md
          - "Nintendo 64": consoles/nintendo/n64.md
          - "GameCube": consoles/nintendo/gamecube.md
          - "Wii": consoles/nintendo/wii.md
          - "Game Boy / Game Boy Pocket": consoles/nintendo/game-boy.md
          - "Game Boy Color": consoles/nintendo/game-boy-color.md
          - "Game Boy Advance / SP": consoles/nintendo/game-boy-advance.md
      - Sega:
          - consoles/sega/index.md
          - "Master System": consoles/sega/master-system.md
          - "Genesis / Mega Drive": consoles/sega/genesis.md
          - "Saturn": consoles/sega/saturn.md
          - "Dreamcast": consoles/sega/dreamcast.md
          - "Game Gear": consoles/sega/game-gear.md
      - Sony:
          - consoles/sony/index.md
          - "PlayStation": consoles/sony/playstation.md
          - "PlayStation 2": consoles/sony/playstation-2.md
          - "PSP": consoles/sony/psp.md
      - Atari:
          - consoles/atari/index.md
          - "Atari 2600": consoles/atari/2600.md
          - "Atari 5200": consoles/atari/5200.md
          - "Atari 7800": consoles/atari/7800.md
          - "Atari Lynx": consoles/atari/lynx.md
          - "Atari Jaguar": consoles/atari/jaguar.md
      - NEC:
          - consoles/nec/index.md
          - "TurboGrafx-16 / PC Engine": consoles/nec/turbografx-16.md
      - SNK:
          - consoles/snk/index.md
          - "Neo Geo AES / MVS / CD": consoles/snk/neo-geo.md
          - "Neo Geo Pocket Color": consoles/snk/neo-geo-pocket-color.md
      - Microsoft:
          - consoles/microsoft/index.md
          - "Xbox (original)": consoles/microsoft/xbox.md
      - Other consoles:
          - consoles/other/index.md
          - "3DO": consoles/other/3do.md
          - "ColecoVision": consoles/other/colecovision.md
          - "Intellivision": consoles/other/intellivision.md
          - "Vectrex": consoles/other/vectrex.md
  - PixelNet Edition: pixelnet-edition.md
  - Resources: resources.md
  - Glossary: glossary.md
