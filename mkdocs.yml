site_name: PixelNet Wiki
site_url: https://wiki.pixelnet.ca/
site_description: Guides, mods et réparation de consoles rétro — PixelNet, Trois-Rivières
copyright: © PixelNet · <a href="https://pixelnet.ca">pixelnet.ca</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-horizontal.png
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: material/store
      link: https://pixelnet.ca
      name: Boutique PixelNet
    - icon: material/email
      link: mailto:support@pixelnet.ca
      name: support@pixelnet.ca

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Guides: Guides
            Consoles: Consoles
            Which scaler?: Quel scaler ?
            Glossary: Lexique

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Which scaler?: guides/scalers.md
      - Glossary: guides/glossary.md
  - Consoles:
      - consoles/index.md
      - Nintendo: consoles/nintendo.md
      - Sega: consoles/sega.md
      - Sony: consoles/sony.md
      - Atari: consoles/atari.md
